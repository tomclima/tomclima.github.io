name: Deploy Eleventy to GitHub Pages

on:
  push:
    branches: [ main, master ] # Triggers the build whenever you push to main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci # Installs your packages safely based on package-lock.json

      - name: Build Static Site
        run: npx @11ty/eleventy

      - name: Upload Production Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site' # Tells GitHub to upload your compiled site folder

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4